name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes whatever is still running for the same ref. Without
# this, a job wedged on a slow apt mirror keeps burning minutes long after a
# later commit has already gone green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor (RHEL 9 and Debian 11 ship it as the system
        # python3). 3.14 is what the author's deployment actually runs, and
        # until it was added nothing tested the interpreter in production.
        # 3.12 is the common middle: Debian 13, Ubuntu 24.04.
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Retry once: a slow apt mirror has hung this step for 25 minutes
          # before now, and it is the only network-dependent part of the job.
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg             || sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Byte-compile all scripts
        run: python -m compileall -q scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -p 'test_*.py' -v

      - name: Validate example config
        run: |
          python -m json.tool config/config.example.json > /dev/null
          python - <<'PY'
          import json
          cfg = json.load(open("config/config.example.json"))
          for key in ("paths", "capture", "encode", "cameras"):
              assert key in cfg, f"example config is missing {key!r}"
          assert cfg["capture"]["timeout_seconds"] < cfg["capture"]["interval_seconds"], \
              "timeout_seconds must be below interval_seconds"
          names = [c["name"] for c in cfg["cameras"]]
          assert len(names) == len(set(names)), "duplicate camera names"
          for cam in cfg["cameras"]:
              assert cam.get("method") in ("http", "rtsp"), cam["name"]
          print(f"example config OK ({len(names)} cameras)")
          PY

      - name: Check --version on every entry point
        run: |
          python scripts/timelapse_encode.py --version
          python scripts/timelapse_test.py --version
          python scripts/timelapse_capture.py --version
          python scripts/timelapse_setup.py --version
          python scripts/timelapse_update.py --version

      - name: Wizard runs headless and derives systemd paths
        run: |
          python scripts/timelapse_setup.py --defaults \
                 --output /tmp/wizard.json \
                 --template config/config.example.json
          python -m json.tool /tmp/wizard.json > /dev/null
          echo "ReadWritePaths -> $(python scripts/timelapse_setup.py --print-paths /tmp/wizard.json)"

      - name: End-to-end encode smoke test
        run: python tests/smoke_test.py

  # Added at the first commit of the Windows port rather than the last, per
  # docs/future-features.md item 11e. The suite already passed on Windows
  # before any of this existed, so this leg starts green and its entire value
  # is catching timelapse_platform regressing: half of what that module
  # answers is unreachable from the Linux legs by construction, and this
  # project has twice been bitten by "a local branch is a branch CI has never
  # seen". Developing a Windows port on a Windows box with no Windows CI is
  # that mistake with the platforms swapped.
  #
  # Unit suite only, deliberately. No ffmpeg, so no smoke test: the encode
  # pipeline is shared code that the Linux legs exercise on every push, and
  # installing a build here would add a download to the one job that is
  # otherwise fast and has no network dependency at all.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all scripts
        run: python -m compileall -q scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -p 'test_*.py' -v

      - name: Check --version on every entry point
        run: |
          python scripts/timelapse_encode.py --version
          python scripts/timelapse_test.py --version
          python scripts/timelapse_capture.py --version
          python scripts/timelapse_setup.py --version
          python scripts/timelapse_update.py --version
          python scripts/timelapse_platform.py --version
          python scripts/timelapse_cli.py --version

      # The one place the Windows locations get written into a real file
      # rather than asserted about. No --template here, unlike the Linux leg:
      # config.example.json is a Linux template and its values would simply be
      # copied through, which would test the copying rather than the defaults.
      #
      # --print-paths is deliberately not run. It emits ReadWritePaths= for a
      # systemd unit, so there is nothing for it to be right about here.
      - name: Wizard runs headless and writes Windows locations
        run: |
          python scripts/timelapse_setup.py --defaults --output "${env:RUNNER_TEMP}\wizard.json"
          python -m json.tool "${env:RUNNER_TEMP}\wizard.json"
          python .github/check_windows_config.py "${env:RUNNER_TEMP}\wizard.json"

      # Registering needs elevation and a runner is not the place to find out
      # whether it has any, so this exercises the two halves that do not: the
      # status query answers about services that are not there without
      # inventing a fault, and the registration path refuses cleanly when it
      # cannot proceed rather than tracebacking out of a Win32 error.
      #
      # --remove-units is checked for the absence of a traceback rather than
      # for an exit code, because whether a runner is elevated is not this
      # project's to know: refusing and succeeding are both correct answers,
      # and a Win32 error escaping as a stack trace is not.
      - name: Service registration answers without a service installed
        run: |
          python scripts/timelapse_setup.py --unit-status
          $out = python scripts/timelapse_setup.py --remove-units 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Traceback') { throw "it tracebacked" }
          # Cleared for the reason the comment above gives: a refusal is a
          # correct answer here, and GitHub's PowerShell wrapper ends the step
          # with whatever $LASTEXITCODE holds, so leaving it would fail the
          # step on exactly the outcome this step says is acceptable.
          $global:LASTEXITCODE = 0

      # The Windows analogue of the `shell` job's bash -n and shellcheck, and
      # cheap enough to keep beside the real install that windows-install runs:
      # a parse error is found here in seconds.
      #
      # Globbed rather than listed, and temp/ is not in the glob. The first
      # version of this step named temp/step3b_check.ps1, which is gitignored:
      # it passed on the branch it was written on and would have failed on the
      # first push to main, on a file CI cannot see. Third time this project
      # has met "a local branch is a branch CI has never seen".
      - name: Every PowerShell file parses
        run: |
          $files = @(Get-ChildItem -Path . -Filter *.ps1) +
                   @(Get-ChildItem -Path installer -Filter *.ps1)
          if ($files.Count -lt 3) { throw "found almost no PowerShell files" }
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "$($file.Name) does not parse"
            }
            Write-Host "$($file.Name) parses"
          }

      - name: The command wrapper dispatches
        run: |
          python scripts/timelapse_cli.py --help
          python scripts/timelapse_cli.py version
          # An unknown command must SAY so and must EXIT non-zero, so both are
          # asserted; the exit code was not checked before and is the half that
          # a script calling this would act on. Then it is cleared, because
          # GitHub's PowerShell wrapper ends the step with whatever
          # $LASTEXITCODE holds and this probe exists to fail. Same trap as a
          # native probe under $ErrorActionPreference = 'Stop' in install.ps1,
          # met in a different language.
          $out = python scripts/timelapse_cli.py nonsense 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "an unknown command exited 0" }
          if ($out -notmatch 'unknown command') { throw "no usage error" }
          $global:LASTEXITCODE = 0

  # The Windows counterpart of the `install` job. This leg's comment used to
  # say install.ps1 could not be run on a runner because it needs elevation,
  # and a hosted Windows runner is an administrator with UAC off, so the gap
  # was being defended rather than noticed. Run as prepare.ps1 runs it: under
  # Windows PowerShell 5.1, in its own process, because that is what ships.
  #
  # Not yet run at the time of writing: the branch it was written on was local
  # (M34 in improvement-plan.md), so its first run is the release push.
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The runner is elevated
        run: |
          $me = New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $me.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "not elevated: every step below would be refused, not tested"
          }

      - name: Record the machine PATH before
        run: |
          $key = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(
            'SYSTEM\CurrentControlSet\Control\Session Manager\Environment')
          [string]$key.GetValueKind('Path') |
            Set-Content "$env:RUNNER_TEMP\path-kind.txt"
          [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames') |
            Set-Content "$env:RUNNER_TEMP\path-raw.txt"
          Write-Host "machine PATH is $(Get-Content "$env:RUNNER_TEMP\path-kind.txt")"

      - name: Install unattended
        run: |
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass `
                   -File .\install.ps1 -Unattended 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { throw "install.ps1 exited $rc" }
          # Registration's own lines, which Invoke-Tool used to swallow while
          # printing a warning that it had failed.
          if ($out -notmatch 'Registered TimelapseCapture') {
            throw "the registration output did not reach the log"
          }
          if ($out -match 'Registration did not fully succeed') {
            throw "a registration that worked was reported as failing"
          }

      - name: Verify what landed
        run: |
          foreach ($f in "$env:ProgramFiles\timelapse\timelapse_capture.py",
                         "$env:ProgramData\timelapse\config.json",
                         "$env:ProgramData\timelapse\bin\timelapse.cmd") {
            if (-not (Test-Path $f)) { throw "missing: $f" }
          }
          sc.exe query TimelapseCapture
          if ($LASTEXITCODE -ne 0) { throw "TimelapseCapture is not registered" }
          foreach ($task in 'Timelapse Encode', 'Timelapse Watch') {
            if (-not (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue)) {
              throw "$task is not registered"
            }
          }
          & "$env:ProgramData\timelapse\bin\timelapse.cmd" version
          if ($LASTEXITCODE -ne 0) { throw "timelapse version exited $LASTEXITCODE" }
          $status = & "$env:ProgramData\timelapse\bin\timelapse.cmd" status | Out-String
          Write-Host $status
          if ($status -match 'not installed') { throw "status calls a registered unit absent" }
          $global:LASTEXITCODE = 0

      - name: The machine PATH kept its kind and its variables
        run: |
          $key = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(
            'SYSTEM\CurrentControlSet\Control\Session Manager\Environment')
          $kind = [string]$key.GetValueKind('Path')
          $raw = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $before = (Get-Content "$env:RUNNER_TEMP\path-kind.txt").Trim()
          if ($kind -ne $before) { throw "machine PATH went from $before to $kind" }
          $old = (Get-Content -Raw "$env:RUNNER_TEMP\path-raw.txt").Trim()
          foreach ($entry in ($old -split ';' | Where-Object { $_ -match '%' })) {
            if (-not $raw.Contains($entry)) { throw "lost the unexpanded entry $entry" }
          }
          if (-not $raw.Contains("$env:ProgramData\timelapse\bin")) {
            throw "the command directory was not added"
          }

      - name: Uninstall removes the program and keeps the configuration
        run: |
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass `
                   -File .\install.ps1 -Uninstall 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) { throw "uninstall exited $rc" }
          sc.exe query TimelapseCapture | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "TimelapseCapture is still registered" }
          foreach ($task in 'Timelapse Encode', 'Timelapse Watch') {
            if (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue) {
              throw "$task is still registered"
            }
          }
          if (Test-Path "$env:ProgramFiles\timelapse") { throw "the scripts are still there" }
          if (-not (Test-Path "$env:ProgramData\timelapse\config.json")) {
            throw "uninstall removed the configuration"
          }
          $key = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(
            'SYSTEM\CurrentControlSet\Control\Session Manager\Environment')
          $raw = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($raw.Contains("$env:ProgramData\timelapse\bin")) {
            throw "the command directory is still on the PATH"
          }
          $before = (Get-Content "$env:RUNNER_TEMP\path-kind.txt").Trim()
          if ([string]$key.GetValueKind('Path') -ne $before) {
            throw "uninstall changed the machine PATH's kind"
          }
          # sc.exe query failing is the pass here, and GitHub's PowerShell
          # wrapper ends the step with whatever $LASTEXITCODE holds.
          $global:LASTEXITCODE = 0

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Syntax-check the installer
        run: bash -n install.sh

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh

      # Exit codes are asserted explicitly. A bash EXIT trap whose last command
      # fails silently overrides the script's real status, which is exactly how
      # a successful install came to report failure once.
      - name: Installer honours --help without root, and exits 0
        run: |
          bash install.sh --help
          bash install.sh --help > /dev/null; rc=$?
          test "$rc" = "0" || { echo "--help exited $rc, expected 0"; exit 1; }

      - name: Unknown option is rejected with a non-zero status
        run: |
          if bash install.sh --nonsense > /dev/null 2>&1; then
            echo "an unknown option should not have succeeded"; exit 1
          fi

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Full install from a local checkout - the path that skips the tarball
      # download, and the one whose exit status regressed.
      - name: Install unattended
        run: |
          sudo bash install.sh --unattended; rc=$?
          test "$rc" = "0" || { echo "install exited $rc, expected 0"; exit 1; }

      - name: Verify what landed
        run: |
          set -x
          test -x /opt/timelapse/timelapse_capture.py
          test -x /opt/timelapse/timelapse_setup.py
          test -x /opt/timelapse/timelapse_update.py
          test -x /usr/local/bin/timelapse
          # The web server imports the update module by name. It resolves via
          # sys.path[0], so the two only work side by side in the same dir -
          # which is a property of the install, not of the source tree.
          (cd /opt/timelapse && python3 -c 'import timelapse_web')
          # --check must work as a normal user: asking whether an update
          # exists is the one thing here that needs no root.
          timelapse update --help > /dev/null
          # A fresh install has no backups, and saying so is the right answer
          # rather than an error.
          sudo timelapse restore -l | grep -q "No backups"
          # Every config write takes one, including this bare backup call,
          # which is what `timelapse config` uses before opening $EDITOR.
          sudo python3 /opt/timelapse/timelapse_setup.py --backup-now \
               --output /etc/timelapse/config.json
          sudo timelapse restore -l | grep -q "camera(s)"
          bash -n /usr/local/bin/timelapse
          # --help exits 0, a bare invocation is a usage error, and every
          # subcommand the wrapper dispatches is actually documented. The
          # help is generated text, so it can drift from the case statement
          # without anything else noticing.
          timelapse --help > /tmp/help.txt
          timelapse > /tmp/bare.txt || true
          cmp /tmp/help.txt /tmp/bare.txt
          for c in setup cameras transfer web config test usage status \
                   logs version encode web-serve update restore; do
            grep -qE "^  $c " /tmp/help.txt || { echo "undocumented: $c"; exit 1; }
          done
          test "$(awk '{ if (length($0) > 80) c++ } END { print c+0 }' /tmp/help.txt)" = 0
          test -f /etc/systemd/system/timelapse-capture.service
          test -f /etc/systemd/system/timelapse-encode.timer
          id timelapse
          sudo test -r /etc/timelapse/config.json
          sudo python3 -m json.tool /etc/timelapse/config.json > /dev/null
          # ReadWritePaths must have been rewritten from the generated config.
          grep -q '^ReadWritePaths=/var/lib/timelapse/' \
               /etc/systemd/system/timelapse-capture.service
          # All six, not two: the watch units were missing from uninstall for
          # releases while this step checked capture and the encode timer.
          for u in timelapse-capture.service timelapse-encode.service \
                   timelapse-encode.timer timelapse-web.service \
                   timelapse-watch.service timelapse-watch.timer; do
            test -f "/etc/systemd/system/$u"
            systemd-analyze verify "/etc/systemd/system/$u"
          done

      - name: Re-running is safe
        run: |
          sudo bash install.sh --unattended --no-wizard; rc=$?
          test "$rc" = "0" || { echo "re-install exited $rc, expected 0"; exit 1; }

      - name: Uninstall exits 0 and leaves nothing behind
        run: |
          sudo bash install.sh --unattended --uninstall; rc=$?
          test "$rc" = "0" || { echo "uninstall exited $rc, expected 0"; exit 1; }
          test ! -e /opt/timelapse
          test ! -e /usr/local/bin/timelapse
          for u in timelapse-capture.service timelapse-encode.service \
                   timelapse-encode.timer timelapse-web.service \
                   timelapse-watch.service timelapse-watch.timer; do
            test ! -e "/etc/systemd/system/$u" \
              || { echo "uninstall left $u behind"; exit 1; }
          done
